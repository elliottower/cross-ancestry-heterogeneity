[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-ancestry-heterogeneity"
version = "0.1.0"
description = "Multivariate heterogeneity testing for multi-trait genetic effects across ancestry groups"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Elliot Tower", email = "elliot@elliottower.ai"}]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
include = ["cross_ancestry_heterogeneity*"]
